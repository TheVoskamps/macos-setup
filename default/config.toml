# Default-tier macos-setup configuration (config.toml).
#
# Consolidated, hand-editable config for the scalar knobs that used to
# live in separate per-file key=value / line-oriented files
# (config/claude, config/mailer, cron/mailto, profiles). Queried with
# `dasel` — a guaranteed bootstrap primitive.
#
# Tier model (two tiers; lowest to highest priority):
#
#   default  <  [host-selected profiles, in order]  <  host
#
# The [claude], [mailer], and [cron] sections are SINGLE-WINNER: the
# highest tier with a non-empty value for a given key wins (no per-key
# merge). The `profiles` array is the one AGGREGATE key — a default-tier
# `profiles` array is PREPENDED to the host's, and dedup keeps the last
# occurrence. See scripts/config_common.sh.
#
# The [mailer] section ships with active shared relay defaults (the
# default tier resolves at runtime); [claude], [cron], and the profiles
# array stay commented out as in-place documentation. Override per-host
# by editing config.toml in your
# external host tier (${XDG_CONFIG_HOME:-~/.config}/macos-setup/config.toml,
# seeded from computer-specific/_template/config.toml), or per-profile at
# profiles/<profile>/config.toml.

# profiles — the ordered profile list, lowest priority first.
# A default-tier `profiles` array is prepended to each host's array. No
# populated default list ships today; the prepend capability exists for a
# future base list.
#
# IMPORTANT: `profiles` is a bare (top-level) key, so it MUST appear
# ABOVE the first [section] table below. Placing it after a
# [claude]/[mailer]/[cron] header makes TOML nest it under that table
# (e.g. cron.profiles), and the profile list silently disappears.
# Example:
# profiles = ["version-managers", "desktop-ui"]

# [claude] — settings for the ~/.claude/ global Claude config repo.
# Both keys are optional; missing values fall back to defaults.
# [claude]
# Git branch to check out in ~/.claude/. Default: the remote's default
# branch, resolved at run time via `git ls-remote --symref origin HEAD`.
# branch = "main"
# SSH host alias used in the git remote URL. Lets ~/.ssh/config select
# the right IdentityFile per machine. Default: github.com. Final SSH URL
# is: git@<hostname>:TheVoskamps/claude-config.git
# hostname = "github.com-edwin"

# [mailer] — generic SMTP relay settings for outgoing mail (msmtp).
# msmtp is a relay client, not an MTA, so a relay account is required
# (Gmail app-password, Fastmail, your ISP, your own AWS SES SMTP
# credentials, etc.). This default tier carries the shared relay config
# (host/port/from/keychain); each host overrides smtp_from with its own
# machine-named address and (for SES machines) sets smtp_user. Run
# 'make messaging' to generate ~/.msmtprc from the resolved values.
#
# These are REAL, ACTIVE values: the default tier is the tier that
# resolves at runtime, so it must carry working defaults — if it stayed
# commented, resolution would return empty and nothing would mail.
# smtp_user is intentionally absent here; each relay-using host sets it.
[mailer]
# Mailer backend. Only "msmtp" (generic SMTP relay) is supported.
backend = "msmtp"
smtp_host = "email-smtp.us-west-2.amazonaws.com"
smtp_port = 587
smtp_from = "macos-setup.default@internalsystem.net"
# Keychain service name used for the relay password.
keychain_service = "msmtp"
#
# The relay password is NEVER stored in config.toml or ~/.msmtprc. msmtp
# reads it from your login Keychain at send time. Each relay-using host
# adds it once with the SAME service name (keychain_service) and that
# host's username (smtp_user):
#
#   security add-generic-password -s msmtp -a YOUR_SMTP_USER \
#     -w 'YOUR_SMTP_PASSWORD'

# [cron] — scheduled-job settings.
# [cron]
# Email address that scheduled LaunchAgent jobs send their output to.
# When unset, jobs write to a per-job log file instead.
# mailto = "you@example.com"

# [profile] — what this TIER contributes to an install run, beyond its
# Brewfile. Unlike [claude]/[mailer]/[cron], this section is NOT resolved
# across tiers: every tier's [profile] applies on its own, in tier order
# (core -> each opted-in profile, in list order -> host). See
# docs/INSTALL.md.
#
#   post_install  commands run after this tier's Brewfile is applied, in
#                 order. Each entry is a path relative to the repo root
#                 plus optional arguments. A missing or non-executable
#                 script is reported and skipped, not fatal.
#   uninstall     packages this tier removes (binary only; user data on
#                 disk survives).
#   purge         packages this tier removes, additionally passing --zap
#                 to cask uninstalls so the cask's declared user data goes
#                 too. Identical to `uninstall` for formulae and MAS items.
#
# Entries in `uninstall` / `purge` are "<kind>:<identifier>" strings:
#   "brew:<formula>"      e.g. "brew:asdf"
#   "cask:<token>"        e.g. "cask:qblocker"
#   "mas:<id>"            e.g. "mas:1365531024"
#   "mas:<id>:<Name>"     same, with a label for the log line
#
# A package listed here is ALSO filtered out of this tier's Brewfile and
# every lower tier's Brewfile before `brew bundle` sees it — that is the
# "I opted into `web` but I don't want its Chrome" case. See
# scripts/install_filter.sh.
[profile]
# The core tier's own post-install actions:
#   core_setup.sh   computer/host names + the HOMEBREW_NO_* ~/.zshrc exports
#   shell_setup.sh  zsh, Oh My Zsh, ~/.zsh-shared, the aggregated
#                   ~/.aliases.zsh, and the mise ~/.zshrc line pair
#   msmtp_setup.sh  generates ~/.msmtprc from the resolved [mailer] values
post_install = [
  "scripts/core_setup.sh",
  "scripts/shell_setup.sh",
  "scripts/msmtp_setup.sh",
]
uninstall = []
# qblocker is superseded by 1Blocker (the `web` profile). Purge rather than
# uninstall so its preferences go with it.
purge = ["cask:qblocker"]
